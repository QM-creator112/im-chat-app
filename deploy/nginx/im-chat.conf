# ============================================================================
# IM Chat —— Nginx 站点配置
#
# 部署位置（Ubuntu）：/etc/nginx/sites-available/im-chat
# 启用：sudo ln -s /etc/nginx/sites-available/im-chat /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ WebSocket 那一段的三个配置项是「线上能不能聊天」的分水岭，
#    缺任何一个都会出问题，而且第 2 个失败得**非常安静**。
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;                 # 没有域名时写 _；有域名改成你的域名

    # 前端静态文件（npm run build 的产物）
    root /opt/im-chat/web;
    index index.html;

    # 不让 Nginx 暴露版本号（减少被针对性扫描的信息）
    server_tokens off;

    # 限制请求体大小（本项目最大的是 JSON 消息，2m 足够）
    client_max_body_size 2m;

    # ==================== WebSocket ====================
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # ⚠️ 坑 #1：这三行必须都有，缺一个就 400
        #    Nginx 不会自动转发 Upgrade 头，WebSocket 握手全靠它们
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ 坑 #2：Nginx 默认 proxy_read_timeout 是 60 秒。
        #    长连接超过 60 秒没有数据就会被**静默断开**（日志里没有报错）。
        #    必须大于客户端心跳间隔（本项目 25 秒）。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # ⚠️ 坑 #3：默认开启响应缓冲，消息会被攒起来批量发 → 明显延迟。
        proxy_buffering off;
    }

    # ==================== HTTP API ====================
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ==================== 健康检查 ====================
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    # ==================== SPA 路由回落 ====================
    # 前端是单页应用，直接刷新 /chat 这类路径要让 index.html 处理，
    # 否则 404。这是「刷新页面就白屏」的经典原因。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==================== 静态资源缓存 ====================
    # 注意：这里用 ^~ 前缀匹配，避免被 location / 抢走
    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ==================== 压缩 ====================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
}
